workflow:
  rules:
    - when: always

default:
  before_script:
    - |
      echo "Switching to origin/$CI_DEFAULT_BRANCH for scheduled scan"
      git fetch origin "$CI_DEFAULT_BRANCH"
      git checkout "origin/$CI_DEFAULT_BRANCH"
      echo "Current HEAD: $(git log -1 --oneline)"

include:
  - component: $CI_SERVER_FQDN/system/components/opengrep/opengrep-schedule-pipeline@main
    inputs:
      semgrepignore_path: ${CI_API_V4_URL}/projects/221/repository/files/workflows%2Fopengrep-validate%2F.semgrepignore/raw
      excluded_rules_path: ${CI_API_V4_URL}/projects/221/repository/files/workflows%2Fopengrep-validate%2Fexcluded-rules.txt/raw
